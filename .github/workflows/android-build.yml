  # Alternative job without Docker (faster for simple builds)
  build-android-native:
    name: Build Android APK (Native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter (to get Dart for FVM)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install Flutter via FVM
        run: |
          fvm install stable
          fvm use stable --force

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Create .env file
        run: touch .env

      - name: Configure Gradle properties for CI
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.daemon.jvmargs=-Xmx1g
          android.useAndroidX=true
          android.enableJetifier=true
          unityStreamingAssets=
          EOF

      - name: Exclude Unity library from CI build
        run: |
          # Unity IL2CPP compilation is too memory-intensive for standard GitHub-hosted runners.
          # settings.gradle.kts includes :unityLibrary when one of these Gradle files exists.
          rm -f android/unityLibrary/build.gradle
          rm -f android/unityLibrary/build.gradle.kts
          rm -f android/unityLibrary/unityLibrary/build.gradle
          rm -f android/unityLibrary/unityLibrary/build.gradle.kts
          echo "Unity library excluded from CI build."

      - name: Get dependencies
        run: fvm flutter pub get

      - name: Run code generation
        run: fvm flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: fvm flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build Android APK
        run: fvm flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
